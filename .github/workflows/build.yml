name: Compile Minecraft Game

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  build_game:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Forcing Node 22+)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Project Dependencies
        run: npm install

      - name: Force-Install Missing Mineflayer Plugin
        run: npm install @nxg-org/mineflayer-util-plugin --legacy-peer-deps

      - name: Install Missing TS Execution Packages
        run: npm install -g tsx

      - name: Run Clean Build Command
        run: npm run build

      - name: Package Dist Folder
        uses: actions/upload-artifact@v4
        with:
          name: finished-porkbun-game
          path: dist/
