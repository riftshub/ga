name: Compile Minecraft Game

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  build_game:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Forcing Node 22+)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Project Dependencies (With Strict Legacy Fix)
        run: npm install --legacy-peer-deps || npm install

      - name: Auto-Sanitize Deprecated Module Anchors
        run: |
          sed -i 's/mineflayer-util-plugin"));//g' ./src/entities.ts || true
          sed -i 's/mineflayer-util-plugin"));//g' ./src/index.ts || true

      - name: Install Missing TS Execution Packages
        run: npm install -g tsx

      - name: Run Clean Build Command
        run: npm run build

      - name: Package Dist Folder
        uses: actions/upload-artifact@v4
        with:
          name: finished-porkbun-game
          path: dist/
