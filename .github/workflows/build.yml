name: Compile Minecraft Game

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual button forcing

jobs:
  build_game:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Forcing Node 22+)
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Fixes the EBADENGINE warning

      - name: Install Project Dependencies
        run: npm install

      - name: Install Missing TS Execution Packages
        run: npm install -g tsx # Fixes the '/bin/sh: 1: tsx: not found' error

      - name: Run Build Command
        run: npm run build

      - name: Package Dist Folder
        uses: actions/upload-artifact@v4
        with:
          name: finished-porkbun-game
          path: dist/
